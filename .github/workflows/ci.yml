name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

jobs:
  rust:
    name: Rust core (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Tests run on every architecture we ship. Linux uses the oldest
        # supported LTS (22.04, glibc 2.35) because that is the release build
        # host, so a newer-glibc-only dependency fails here instead of shipping.
        # Formatting runs once and clippy on the two x64 rows (see the steps).
        include:
          - os: windows-latest
            label: windows-x64
          - os: windows-11-arm
            label: windows-arm64
          - os: ubuntu-22.04
            label: linux-x64
          - os: ubuntu-22.04-arm
            label: linux-arm64
          - os: macos-latest
            label: macos
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The image is part of the key: compiled artifacts are not portable
      # across distro versions (a 24.04 cache restored on 22.04 yielded
      # "can't find crate for `tauri`" despite matching fingerprints).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-${{ matrix.os }}
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test
        run: cargo test --workspace
      # `env` is not a valid context in a job-level `if`, so the secret gate
      # lives on the step; this reuses the Linux test row's build cache instead
      # of paying for a separate job and toolchain setup.
      - name: Live smoke (requires the TMDB_API_KEY secret)
        if: matrix.label == 'linux-x64' && env.TMDB_API_KEY != ''
        run: cargo run -p filmlogger-rs --example tmdb_smoke
      - name: Clippy
        if: matrix.label == 'linux-x64' || matrix.label == 'windows-x64'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        if: matrix.label == 'linux-x64'
        run: cargo fmt --all -- --check

  ui:
    name: Desktop UI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # The desktop rows only need the built bundle; building it here once
      # instead of per OS/arch avoids four redundant Vite builds.
      - name: Share the UI bundle
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: apps/desktop/ui/dist
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Desktop shell (${{ matrix.label }})
    needs: ui
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Same release-mode build the release workflow bundles, without the
        # installer/notarization step: proves the Tauri shell links on every
        # platform and architecture we ship. Linux uses the release host
        # (22.04, glibc 2.35) so the AppImage glibc floor is exercised here.
        # The UI bundle comes from the `ui` job instead of being rebuilt here.
        include:
          - os: windows-latest
            label: windows-x64
            buildArgs: --target x86_64-pc-windows-msvc
          - os: windows-11-arm
            label: windows-arm64
            buildArgs: --target aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            label: linux-x64
            buildArgs: ""
          - os: ubuntu-22.04-arm
            label: linux-arm64
            buildArgs: ""
          - os: macos-latest
            label: macos
            buildArgs: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-${{ matrix.os }}
      - name: Download the UI bundle
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: apps/desktop/ui/dist
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build desktop shell (release, no bundle)
        run: cargo build --release -p filmlogger-rs-desktop ${{ matrix.buildArgs }}

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # Caches the Gradle distribution and resolved dependencies; without it
      # every run re-downloads them (and one run already hit Maven's 429).
      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: apps/android
      - name: Assemble
        working-directory: apps/android
        run: |
          # gradlew is committed without the exec bit (added from Windows), so call it via bash.
          bash ./gradlew \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            testDebugUnitTest \
            assembleDebug \
            -PtmdbApiKey="$TMDB_API_KEY" \
            -PcargoBin="$(command -v cargo)" \
            -PndkRoot="$ANDROID_NDK_LATEST_HOME"
