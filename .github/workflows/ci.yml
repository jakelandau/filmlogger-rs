name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

jobs:
  rust:
    name: Rust core (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows ships x64 and ARM64 desktop builds, so both are tested on
        # native hardware; macOS is built here so the Tauri app cannot regress
        # on Apple platforms before we have a signed macOS release.
        include:
          - os: windows-latest
            label: windows-x64
          - os: windows-11-arm
            label: windows-arm64
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  live-smoke:
    name: Live TMDB smoke
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `env` is not a valid context in a job-level `if`, so the gate lives on
      # the step; the workflow-level `TMDB_API_KEY` env is visible here.
      - name: Live smoke (requires the TMDB_API_KEY secret)
        if: env.TMDB_API_KEY != ''
        run: cargo run -p filmlogger-rs --example tmdb_smoke

  ui:
    name: Desktop UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  desktop:
    name: Desktop shell (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Same release-mode build the release workflow bundles, without the
        # installer/notarization step: proves the UI assets embed and the Tauri
        # shell links on every platform and Windows architecture we ship.
        include:
          - os: windows-latest
            label: windows-x64
            buildArgs: --target x86_64-pc-windows-msvc
          - os: windows-11-arm
            label: windows-arm64
            buildArgs: --target aarch64-pc-windows-msvc
          - os: ubuntu-latest
            label: linux
            buildArgs: ""
          - os: macos-latest
            label: macos
            buildArgs: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install UI dependencies
        run: npm ci --prefix apps/desktop/ui
      - name: Build UI
        run: npm run build --prefix apps/desktop/ui
      - name: Build desktop shell (release, no bundle)
        run: cargo build --release -p filmlogger-rs-desktop ${{ matrix.buildArgs }}

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Assemble
        working-directory: apps/android
        run: |
          # gradlew is committed without the exec bit (added from Windows), so call it via bash.
          bash ./gradlew \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            testDebugUnitTest \
            assembleDebug \
            -PtmdbApiKey="$TMDB_API_KEY" \
            -PcargoBin="$(command -v cargo)" \
            -PndkRoot="$ANDROID_NDK_LATEST_HOME"
