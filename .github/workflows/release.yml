name: Release

on:
  push:
    tags: ["v*"]

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

jobs:
  bundle:
    name: Desktop bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: macos-latest
            bundles: dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install UI dependencies
        run: npm ci --prefix apps/desktop/ui
      - name: Build UI
        run: npm run build --prefix apps/desktop/ui
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build bundle
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: filmlogger-${{ matrix.os }}
          path: target/release/bundle/
          if-no-files-found: error
