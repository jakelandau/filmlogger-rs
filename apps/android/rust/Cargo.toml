[package]
name = "filmlogger-rs-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "filmlogger_rs_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
chrono = { workspace = true }
serde_json = { workspace = true }
filmlogger-rs = { path = "../../../crates/filmlogger-rs" }
uniffi = { version = "0.32" }

[dev-dependencies]
# Enables the `uniffi-bindgen` CLI (via `uniffi::uniffi_bindgen_main`) for the
# `bindgen` example; kept to dev so the shipped cdylib stays lean.
uniffi = { version = "0.32", features = ["cli"] }

[lints]
workspace = true
