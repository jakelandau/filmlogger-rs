[package]
name = "filmlogger-rs-desktop"
version = "0.1.0"
description = "FilmLogger desktop application (Tauri)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "filmlogger_rs_desktop"
path = "src/lib.rs"

[features]
# Production builds: embed the built UI and serve it over a custom
# protocol instead of loading the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
filmlogger-rs = { path = "../../../crates/filmlogger-rs" }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
