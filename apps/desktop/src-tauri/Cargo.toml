[package]
name = "film-logger-desktop"
version = "0.1.0"
description = "FilmLogger desktop application (Tauri)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "film_logger_desktop"
path = "src/lib.rs"

[features]
# Production builds: embed the built UI and serve it over a custom
# protocol instead of loading the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
film-logger = { path = "../../../crates/film-logger" }
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
